<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Toshimi Onishi Art Archives</title>

<style>
body {
  background-color: #0b0b0b;
  color: #eee;
  margin: 0;
  font-family: serif;
}

/* ===== トップ ===== */
.hero {
  position: relative;
  text-align: center;
}

.hero-bg {
  width: 80%;
  max-height: 500px;
  object-fit: cover;
  display: block;
  margin: 20px auto;
  filter: brightness(0.55);
}

.hero-title {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  color: #25a8a8;
  font-size: 48px;
  letter-spacing: 3px;
  margin: 0;
  text-align: center;

  opacity: 0;
  filter: blur(12px);
  animation: fadeInTitle 3s ease-out forwards;
}

@keyframes fadeInTitle {
  0% { opacity: 0; filter: blur(12px); }
  60% { opacity: 0.7; filter: blur(4px); }
  100% { opacity: 1; filter: blur(0); }
}

/* ===== 略歴 ===== */
.portrait {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
}

.picture {
  display: block;
  width: 400px;
  max-width: 90%;
  margin-bottom: 30px;
}

.bio {
  text-align: center;
  padding: 80px 20px;
}

.bio .name {
  font-size: 34px;
  margin-bottom: 20px;
}

.bio .years {
  font-size: 18px;
  color: #aaa;
  margin-bottom: 40px;
}

.bio .history {
  font-size: 16px;
  line-height: 2.2;
  color: #ddd;
}

/* ===== ギャラリー ===== */
.gallery img {
  display: block;
  margin: 80px auto;
  cursor: pointer;
}

.small { max-width: 40%; }
.medium { max-width: 60%; }
.large { max-width: 89%; }

/* ===== テキスト ===== */
.text {
  text-align: center;
  margin: 80px 20px;
}

.text .title {
  font-size: 40px;
  margin-bottom: 20px;
}

.text .desc {
  font-size: 18px;
  color: #aaa;
  line-height: 1.8;
}
</style>

</head>

<body>

<!-- ===== トップ ===== -->
<div class="hero">
  <img src="001.jpg" class="hero-bg">

  <h1 class="hero-title">
    Toshimi Onishi<br>
    Art Archives
  </h1>
</div>

<!-- ===== 略歴 ===== -->
<div class="bio">
  <div class="portrait">
    <img src="父写真.JPG" class="picture">
  </div>

  <div class="name">
    大西　敏巳<br>
    Toshimi Onishi
  </div>

  <div class="years">
    1940–2001　兵庫
  </div>

  <div class="history">
    1959　二紀展初入選<br>
    1987　栗原賞受賞<br>
    1993　黒田賞受賞<br>
    2000　第54回二紀展 文部大臣奨励賞受賞
  </div>
</div>

<!-- ===== ギャラリー（作品ページリンク） ===== -->
<div class="gallery">

  <a href="work001.html"><img src="001.jpg" class="large"></a>
  <a href="work002.html"><img src="002.jpg" class="large"></a>
  <a href="work003.html"><img src="003.JPG" class="small"></a>
  <a href="work004.html"><img src="004.JPG" class="small"></a>
  <a href="work005.html"><img src="005.JPG" class="small"></a>

</div>

<!-- ===== 説明 ===== -->
<div class="text">
  <div class="title">「刻」の記録</div>
  <div class="desc">
    父が遺した油彩と水彩の作品群<br>
    時間と記憶のアーカイブ
  </div>
</div>

</body>
</html>
