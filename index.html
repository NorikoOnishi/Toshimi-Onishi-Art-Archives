<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Toshimi Onishi Art Archives</title>

<style>
/* ===== 全体 ===== */
body {
  background-color: #0b0b0b;
  color: #eee;
  margin: 0;
  font-family: serif;
}

/* ===== トップ ===== */
.hero {
  position: relative;
  text-align: center;
}

/* ★ここ修正：hero-bg追加（今抜けてる） */
.hero-bg {
  width: 80%;
  max-height: 500px;
  object-fit: cover;
  display: block;
  margin: 40px auto;
  filter: brightness(0.6);
}

/* ★ここ修正：hero-titleに統一 */
.hero-title {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  color: #3f6f7a;
  font-size: 48px;
  letter-spacing: 3px;
  margin: 0;
  text-align: center;
}

/* ===== 略歴（追加修正） ===== */
.bio {
  text-align: center;
  padding: 80px 20px;
  background-color: #0b0b0b;
}

.bio .name {
  font-size: 34px;
  margin-bottom: 20px;
}

.bio .years {
  font-size: 18px;
  color: #aaa;
  margin-bottom: 40px;
}

.bio .history {
  font-size: 16px;
  line-height: 2.2;
  color: #ddd;
}

/* ===== ギャラリー共通 ===== */
.gallery img {
  display: block;
  margin: 80px auto;
  cursor: pointer;
}

/* ===== サイズ分類 ===== */
.small { max-width: 40%; }
.medium { max-width: 70%; }
.large { max-width: 90%; }
.special {
  max-width: 100%;
  margin: 120px auto;
  opacity: 0.85;
}
  
/* ===== テキスト ===== */
.text {
  text-align: center;
  margin: 80px 20px;
}

.text .title {
  font-size: 40px;
  margin-bottom: 20px;
}

.text .desc {
  font-size: 18px;
  color: #aaa;
  line-height: 1.8;
}

/* ===== 拡大表示 ===== */
.lightbox {
  display: none;
  position: fixed;
  z-index: 999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.lightbox img {
  max-width: 90%;
  max-height: 90%;
}
</style>

</head>

<body>

<!-- ===== トップ ===== -->
<div class="hero">
  <img src="001.jpg" class="hero-bg">

  <h1 class="hero-title">
    Toshimi Onishi<br>
    Art Archives
  </h1>
</div>

<!-- ===== 略歴 ===== -->
<div class="bio">
  <div class="name">
    大西　敏巳<br>
    Toshimi Onishi
  </div>

  <div class="years">
    1940–2001　兵庫
  </div>

  <div class="history">
    1959　二紀展初入選<br>
    1987　栗原賞受賞<br>
    1993　黒田賞受賞<br>
    2000　第54回二紀展 文部大臣奨励賞受賞
  </div>
</div>

<!-- ===== ギャラリー ===== -->
<div class="gallery">

  <img src="001.jpg" class="special" onclick="openLightbox(this.src)">
  <img src="002.jpg" class="special" onclick="openLightbox(this.src)">
  <img src="003.JPG" class="small" onclick="openLightbox(this.src)">
  <img src="004.JPG" class="small" onclick="openLightbox(this.src)">
  <img src="005.JPG" class="small" onclick="openLightbox(this.src)">

</div>

<!-- ===== 説明 ===== -->
<div class="text">
  <div class="title">「刻」の記録</div>
  <div class="desc">
    父が遺した油彩と水彩の作品群<br>
    時間と記憶のアーカイブ
  </div>
</div>

<!-- ===== 拡大表示 ===== -->
<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
  <img id="lightbox-img">
</div>

<script>
function openLightbox(src) {
  document.getElementById("lightbox-img").src = src;
  document.getElementById("lightbox").style.display = "flex";
}
</script>

</body>
</html>
