<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Toshimi Onishi Art Archives</title>

<style>
/* ===== 全体 ===== */
body {
  background-color: #111;
  color: #eee;
  margin: 0;
  font-family: serif;
}

/* ===== トップ（1枚ドン） ===== */
.hero {
  position: relative;
  text-align: center;
}

.hero img {
  width: 100%;
  height: auto;
  display: block;
}

.hero h1 {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 48px;
  letter-spacing: 3px;
  margin: 0;
}

/* ===== ギャラリー共通 ===== */
.gallery img {
  display: block;
  margin: 80px auto;
  cursor: pointer;
}

/* ===== サイズ分類（ここが今回のポイント） ===== */
.small { max-width: 40%; }
.medium { max-width: 70%; }
.large { max-width: 90%; }

/* ===== テキスト ===== */
.text {
  text-align: center;
  margin: 80px 20px;
}

.text .title {
  font-size: 40px;
  margin-bottom: 20px;
}

.text .desc {
  font-size: 18px;
  color: #aaa;
  line-height: 1.8;
}

/* ===== 拡大表示 ===== */
.lightbox {
  display: none;
  position: fixed;
  z-index: 999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.lightbox img {
  max-width: 90%;
  max-height: 90%;
}
</style>

</head>

<body>

<!-- ===== トップ ===== -->
<div class="hero">
  <img src="001.jpg">
  <h1>Toshimi Onishi Art Archives</h1>
</div>

<!-- ===== ギャラリー ===== -->
<div class="gallery">

  <img src="001.jpg" class="large" onclick="openLightbox(this.src)">
  <img src="002.jpg" class="medium" onclick="openLightbox(this.src)">
  <img src="003.JPG" class="small" onclick="openLightbox(this.src)">
  <img src="004.JPG" class="medium" onclick="openLightbox(this.src)">
  <img src="005.JPG" class="large" onclick="openLightbox(this.src)">

</div>

<!-- ===== 説明 ===== -->
<div class="text">
  <div class="title">「刻」の記録</div>
  <div class="desc">
    父が遺した油彩と水彩の作品群<br>
    時間と記憶のアーカイブ
  </div>
</div>

<!-- ===== 拡大表示 ===== -->
<div class="lightbox" id="lightbox" onclick="this.style.display='none'">
  <img id="lightbox-img">
</div>

<script>
function openLightbox(src) {
  document.getElementById("lightbox-img").src = src;
  document.getElementById("lightbox").style.display = "flex";
}
</script>

</body>
</html>
