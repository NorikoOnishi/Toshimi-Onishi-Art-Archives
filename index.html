<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Toshimi Onishi Art Archives</title>

<style>
body {
  background-color: #0b0b0b;
  color: #eee;
  margin: 0;
  font-family: serif;
}

/* ===== トップ ===== */
.hero {
  position: relative;
  text-align: center;
}

.hero-bg {
  width: 80%;
  max-height: 500px;
  object-fit: cover;
  display: block;
  margin: 20px auto;
  filter: brightness(0.55);
}

.hero-title {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  color: #25a8a8;
  font-size: 48px;
  letter-spacing: 3px;
  margin: 0;
  text-align: center;

  opacity: 0;
  filter: blur(12px);
  animation: fadeInTitle 3s ease-out forwards;
}

@keyframes fadeInTitle {
  0% { opacity: 0; filter: blur(12px); }
  60% { opacity: 0.7; filter: blur(4px); }
  100% { opacity: 1; filter: blur(0); }
}

/* ===== 略歴 ===== */
.portrait {
  display: flex;
  justify-content: center;
  align-items: center;
}

.picture {
  width: 400px;
  max-width: 90%;
  margin-bottom: 30px;
}

.bio {
  text-align: center;
  padding: 80px 20px;
}

.bio .name {
  font-size: 34px;
  margin-bottom: 20px;
}

.bio .years {
  font-size: 18px;
  color: #aaa;
  margin-bottom: 40px;
}

.bio .history {
  font-size: 16px;
  line-height: 2.2;
  color: #ddd;
}

/* ===== カルーセル ===== */
.featured-carousel{
  text-align:center;
  padding:100px 20px;
}

.featured-carousel h2{
  color:#25a8a8;
  margin-bottom:40px;
  letter-spacing:2px;
  font-weight: normal;
}

.carousel{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:30px;
}

.carousel img{
  width:100%;
  max-width:780px;
  height:520px;
  object-fit:contain;
  display:block;
  margin:0 auto;
  background:#0b0b0b;
}

#carousel-image{
  opacity:0;
  transform: translateX(60px);
  filter: blur(12px);
}

@keyframes museumSlide {
  0% {
    opacity: 0;
    transform: translateX(60px);
    filter: blur(12px);
  }
  60% {
    opacity: 0.6;
    filter: blur(5px);
  }
  100% {
    opacity: 1;
    transform: translateX(0);
    filter: blur(0);
  }
}

.fade{
  animation: museumSlide 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.carousel button{
  background:none;
  border:none;
  color:#25a8a8;
  font-size:32px;
  cursor:pointer;
  opacity:0.6;
}

.carousel button:hover{
  opacity:1;
}

/* ===== ギャラリー ===== */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 100px 80px;
  width: 60%;
  max-width: 1200px;
  margin: 120px auto;
}

.gallery img {
  width: 65%;
  margin: 0 auto;
  cursor: pointer;
  display: block;
  object-fit: contain;
  transition: all 0.4s ease;
}

.gallery img:hover {
  transform: scale(1.03);
  opacity: 0.9;
}

/* ===== 作品ページ ===== */
.work-page {
  display: none;
  text-align: center;
  padding: 60px 20px;
}

.work-page img {
  width: min(80%, 900px);
  height: auto;
  display: block;
  margin: 40px auto;
}

.back {
  display: inline-block;
  margin-top: 40px;
  color: #25a8a8;
  cursor: pointer;
}

/* ===== 問い合わせ ===== */
.contact {
  background-color: #0b0b0b;
  text-align: center;
  padding: 100px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.contact-title {
  font-size: 32px;
  margin-bottom: 30px;
  color: #25a8a8;
}

.contact form {
  width: 80%;
  max-width: 600px;
  margin: 0 auto;
}

.contact input,
.contact textarea {
  width: 100%;
  margin-bottom: 15px;
  padding: 12px;
  background: #111;
  border: 1px solid #333;
  color: #eee;
  font-family: serif;
}

.contact button {
  background: #25a8a8;
  color: #000;
  border: none;
  padding: 12px 30px;
  cursor: pointer;
  font-size: 16px;
}

.contact button:hover {
  opacity: 0.8;
}

/* ありがとう画面 */
#thanks {
  display:none;
  text-align:center;
  padding:80px 20px;
}
</style>
</head>

<body>

<!-- ===== トップ ===== -->
<div id="top">

  <div class="hero">
    <img src="001.jpg" class="hero-bg">

    <h1 class="hero-title">
      Toshimi Onishi<br>
      Art Archives
    </h1>
  </div>

  <div class="bio">
    <div class="portrait">
      <img src="portrait.JPG" class="picture">
    </div>

    <div class="name">大西　敏巳<br>Toshimi Onishi</div>

    <div class="years">1940–2001　兵庫</div>

    <div class="history">
      1959　二紀展初入選<br>
      1987　栗原賞受賞<br>
      1993　黒田賞受賞<br>
      2000　第54回二紀展 文部大臣奨励賞受賞
    </div>
  </div>

  <div class="featured-carousel">
    <h2>時間と記憶のアーカイブ</h2>

    <div class="carousel">
      <button class="prev">❮</button>
      <img id="carousel-image" src="001.jpg">
      <button class="next">❯</button>
    </div>
  </div>

  <div class="gallery">
    <img src="001.jpg" onclick="openWork(1)">
    <img src="002.jpg" onclick="openWork(2)">
    <img src="003.JPG" onclick="openWork(3)">
    <img src="004.JPG" onclick="openWork(4)">
    <img src="005.JPG" onclick="openWork(5)">
    <img src="006.JPG" onclick="openWork(6)">
    <img src="007.JPG" onclick="openWork(7)">
    <img src="008.JPG" onclick="openWork(8)">
    <img src="009.jpg" onclick="openWork(9)">
    <img src="200.JPG" onclick="openWork(200)">
  </div>

</div>

<!-- ===== 作品ページ ===== -->
<div id="work1" class="work-page">
  <img src="001.jpg">
  <h2>作品001</h2>
  <div class="back" onclick="back()">← 戻る</div>
</div>

<div id="work2" class="work-page">
  <img src="002.jpg">
  <h2>作品002</h2>
  <div class="back" onclick="back()">← 戻る</div>
</div>

<!-- ===== 問い合わせ ===== -->
<div class="contact">

  <div class="contact-title">Contact</div>

  <form action="mailto:yourmail@example.com" method="post" enctype="text/plain">
    <input type="text" name="name" placeholder="お名前" required>
    <input type="email" name="email" placeholder="メールアドレス" required>
    <textarea name="message" rows="6" placeholder="メッセージ内容" required></textarea>
    <button type="submit">送信</button>
  </form>

  <div id="thanks">
    <h2 style="color:#25a8a8;">送信ありがとうございます</h2>
    <button onclick="backToForm()">戻る</button>
  </div>

</div>

<script>
window.addEventListener("DOMContentLoaded", () => {

  /* ===== カルーセル ===== */
  const images = [
    "001.jpg",
    "kobe-niki.JPG",
    "002.jpg",
    "garage.JPG",
    "009.jpg"
  ];

  let current = 0;

  const img = document.getElementById("carousel-image");
  const next = document.querySelector(".next");
  const prev = document.querySelector(".prev");

  function showImage(){
    if(!img) return;

    img.classList.remove("fade");
    void img.offsetWidth;

    img.src = images[current];

    requestAnimationFrame(()=>{
      img.classList.add("fade");
    });
  }

  if(img && next && prev){

    next.onclick = () => {
      current = (current + 1) % images.length;
      showImage();
    };

    prev.onclick = () => {
      current = (current - 1 + images.length) % images.length;
      showImage();
    };

    showImage();

    setInterval(()=>{
      current = (current + 1) % images.length;
      showImage();
    }, 9000);
  }

  /* ===== 作品ページ ===== */
  window.openWork = function(n){
    document.getElementById("top").style.display="none";
    document.getElementById("work"+n).style.display="block";
  };

  window.back = function(){
    document.querySelectorAll(".work-page").forEach(p=>p.style.display="none");
    document.getElementById("top").style.display="block";
  };

  /* ===== フォーム ===== */
  const form = document.querySelector("form");
  const thanks = document.getElementById("thanks");

  form.addEventListener("submit",(e)=>{
    e.preventDefault();
    form.style.display="none";
    thanks.style.display="block";
  });

  window.backToForm = function(){
    form.style.display="block";
    thanks.style.display="none";
  };

});
</script>

</body>
</html>
「スクロールでフェード演出」

ここまで来てるので、かなりいいとこまで仕上がってる。
